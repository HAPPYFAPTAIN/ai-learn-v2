name: Learn core (multi-tenant)
# 与 official-integration 分开：这组测试需要真 Postgres + pgvector，
# 跑的是多租户基线（行级安全、队列语义、向量召回）。
on:
  pull_request:
    paths:
      - "learn_core/**"
      - "learn_api/**"
      - "learn_embed/**"
      - "learn_migrate/**"
      - "learn_web/**"
      - "deploy/learn-v2/**"
      - "deploy/learn-reaper.*"
      - "runtime/learn-v2-release-policy.json"
      - "scripts/learn_v2_release.py"
      - "scripts/deployment/receive_learn_v2.py"
      - "tests/deployment/**"
      - "migrations/**"
      - "tests/learn_core/**"
      - "scripts/phase0/**"
      - "scripts/learn_web/**"
      - "scripts/dev/local_provider_*.py"
      - "scripts/ci-check.sh"
      - "scripts/learn_migrate.py"
      - "requirements-learn-*.txt"
      - "requirements-learn-embed.txt"
      - "alembic.ini"
      - ".github/workflows/learn-core.yml"
  workflow_dispatch:
    inputs:
      deploy_company:
        description: "Deploy this tested main commit to the company server"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tenant-baseline:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      LEARN_DATABASE_URL: postgresql+psycopg://learn_app:app@127.0.0.1:5432/learn_dev
      LEARN_DATABASE_OWNER_URL: postgresql+psycopg://learn_owner:owner@127.0.0.1:5432/learn_dev
      LEARN_PROCRASTINATE_DSN: postgresql://learn_app:app@127.0.0.1:5432/learn_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-learn-core.txt
      - name: Create roles, database and extensions
        run: |
          psql -d learn_dev <<'SQL'
          CREATE ROLE learn_owner LOGIN PASSWORD 'owner';
          CREATE ROLE learn_app LOGIN PASSWORD 'app';
          CREATE ROLE learn_ops LOGIN PASSWORD 'ops' BYPASSRLS;
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          ALTER DATABASE learn_dev OWNER TO learn_owner;
          GRANT ALL ON SCHEMA public TO learn_owner;
          GRANT USAGE ON SCHEMA public TO learn_app, learn_ops;
          SQL
      - name: Apply schema
        run: |
          alembic upgrade head
          python scripts/phase0/apply_queue_schema.py
      - name: Tenant isolation, Kotaemon tables, queue and vector gates
        run: |
          python scripts/learn_web/export_openapi.py --check
          python -m pytest tests/learn_core -q
          python scripts/phase0/validate_queue.py
          python scripts/phase0/validate_vector.py

  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learn_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: learn_web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash ../scripts/ci-check.sh web
      - name: Exercise the company release receiver
        working-directory: .
        run: python -m unittest discover -s tests/deployment
      - name: Build and verify the v2 candidate
        working-directory: .
        run: |
          python scripts/learn_v2_release.py pack
          mkdir -p output/learn-v2/extracted
          tar -xzf output/learn-v2/learn-v2-*.tar.gz -C output/learn-v2/extracted
          python scripts/learn_v2_release.py verify output/learn-v2/extracted
      - uses: actions/upload-artifact@v4
        with:
          name: learn-v2-${{ github.sha }}
          path: output/learn-v2/learn-v2-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-company:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_company
    needs: [tenant-baseline, web-build]
    runs-on: ubuntu-24.04
    environment: learn-production
    concurrency:
      group: learn-v2-company-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: learn-v2-${{ github.sha }}
          path: candidate
      - name: Deliver the tested release
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.LEARN_SSH_HOST }}
          DEPLOY_PORT: ${{ vars.LEARN_SSH_PORT }}
          DEPLOY_USER: ${{ vars.LEARN_SSH_USER }}
          HOST_KEYS: ${{ secrets.LEARN_SSH_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.LEARN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_PORT:?}" "${HOST_KEYS:?}" "${DEPLOY_KEY:?}"
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$dir/key"
          printf '%s\n' "$HOST_KEYS" > "$dir/known_hosts"
          file="candidate/learn-v2-${GITHUB_SHA:0:12}.tar.gz"
          sum=$(sha256sum "$file" | cut -d' ' -f1)
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=15 \
            -i "$dir/key" -p "$DEPLOY_PORT" -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
            "deploy $GITHUB_SHA $sum" < "$file"
