name: Official integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r runtime/requirements-test.txt
      - run: python scripts/check_repository.py
      - run: python -m pytest -q tests/test_learn_platform.py tests/test_learn_startup.py tests/test_official_release.py
      - run: python scripts/official_release.py pack
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r runtime/requirements-browser.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
