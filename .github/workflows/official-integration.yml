name: Official integration
# 只在 PR 上跑；合并到 main 后不再重跑，需要时在 Actions 里手动运行（workflow_dispatch）。
# 检查内容在 scripts/ci-check.sh，推送前在本地跑的也是它。
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r runtime/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/ci-check.sh platform
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r runtime/requirements-browser.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: scripts/ci-check.sh browser
