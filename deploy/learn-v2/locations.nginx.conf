# Include within the isolated HTTPS server block.
# The official login, entry ticket exchange, and /official-api routes are supplied
# by the site's existing integration.
location = /official/learn-everything/app {
    return 308 /official/learn-everything/app/;
}

location ^~ /official/learn-everything/app/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_pass http://127.0.0.1:18080/app/;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location ^~ /official/learn-everything/api/v2/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_pass http://127.0.0.1:18080/api/v2/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Learn-User "";
    proxy_set_header X-Learn-Ticket "";
    # Contains only proxy_set_header X-Learn-Internal-Secret "<secret>";
    include /etc/ai-learn-v2/nginx-secret.conf;
    proxy_next_upstream off;
    client_max_body_size 51m;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 660s;
}
