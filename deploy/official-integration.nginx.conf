# Include inside the existing HTTPS server. Merge only these learning routes.
location = /_official-learn-authorize {
    internal;
    proxy_pass http://127.0.0.1:18030/api/v1/console/learn-everything/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /official/learn-everything {
    return 308 /official/learn-everything/;
}
location = /official/learn-everything/ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    auth_request /_official-learn-authorize;
    auth_request_set $learn_entry_cookie $upstream_http_x_learn_entry_cookie;
    auth_request_set $learn_user $upstream_http_x_learn_user;
    add_header Set-Cookie $learn_entry_cookie always;
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /official/learn-everything;
    proxy_set_header X-Learn-User $learn_user;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location ^~ /official/learn-everything/ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    auth_request /_official-learn-authorize;
    auth_request_set $learn_user $upstream_http_x_learn_user;
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /official/learn-everything;
    proxy_set_header X-Learn-User $learn_user;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
