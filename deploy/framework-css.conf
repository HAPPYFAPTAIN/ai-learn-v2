# Gradio 4.44.1 bootstraps this public, hashed stylesheet from the origin root.
# This exact filename is the only root-level exception; all account routes
# continue through the existing /official/learn-everything/ authorization gate.
location = /assets/index-BOW2xVAS.css {
    proxy_pass http://127.0.0.1:7860/assets/index-BOW2xVAS.css;
    proxy_set_header Host $host;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
